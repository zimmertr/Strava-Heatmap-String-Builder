name: PR Checks

# The image a PR would ship, through yggdrasil's docker-build module: hadolint,
# the linux/amd64 image built but not pushed, a Trivy table in a sticky
# comment, the smoke test, then a failure on any fixable Critical or High, as
# the release would refuse.
#
# Branch protection can require `Docker Build / Docker Build` (this job's name,
# then the module's); renaming either strands PRs on a check that never
# reports.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  docker-build:
    name: Docker Build
    uses: zimmertr/yggdrasil/.github/workflows/docker-build.yml@667ac9372b2be9ed09b67c2da14f6fbd93e2b1b3 # v1.0.0
    permissions:
      contents: read # the module checks out the repo
      pull-requests: write # the sticky scan comment
    with:
      # What only a built image shows.
      smoke-test: |
        docker run --rm "$IMAGE" --help
        docker run --rm --entrypoint python3 "$IMAGE" -c 'import stravacookies'
