name: PR Title

# The PR title becomes the squash commit's title. yggdrasil's pr-title module
# refuses a title that isn't `type(scope): summary`, so the history reads the
# same as every other repo's.
#
# A workflow of its own, because it has to run when only the title changes
# (`edited`). `synchronize` stays in the list because a check reports against
# the head commit.
#
# Branch protection can require `PR Title / PR Title` (this job's name, then
# the module's); renaming either strands PRs on a check that never reports.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  title:
    name: PR Title
    uses: zimmertr/yggdrasil/.github/workflows/pr-title.yml@d8443185af7a5e3b4b197b8ee167533d79c816c5 # v0.14.0
    permissions:
      pull-requests: read # the action reads the PR's current title from the API
